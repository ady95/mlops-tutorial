[project]
name = "ch07-flowers-pipeline"
version = "0.1.0"
description = "MLOps 따라하기 7장: ZenML 학습 파이프라인과 CI/CD"
requires-python = ">=3.12"
# 학습 파이프라인 실행에 필요한 것 (MLflow가 모델 의존성으로 기록하는 범위)
dependencies = [
    "zenml==0.98.0",
    "mlflow==3.17.1",
    "pillow==13.0.0",
    "pyyaml>=6",
    "matplotlib>=3.11",
    "scikit-learn>=1.9",
    "s3fs",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
cu130 = ["torch==2.14.1", "torchvision==0.29.1"]

# 데이터 버전 관리와 테스트 도구 — 모델 의존성에 섞이지 않게 dev 그룹으로 (06-2)
[dependency-groups]
dev = [
    "dvc[s3]==3.67.1",
    "pytest>=8",
    "httpx==0.28.1",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
