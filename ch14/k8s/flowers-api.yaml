# 꽃 분류 추론 서버를 Kubernetes로 (14-4). 네임스페이스 mlops와 시크릿 flowers-api를 먼저 만들고, ${HOST_IP}는 apply할 때 채운다:
#   HOST_IP=$(hostname -I | awk '{print $1}') envsubst '$HOST_IP' < flowers-api.yaml | kubectl apply -f -
# 파드 안의 localhost는 파드 자신이다. MLflow와 모델 파일(RustFS)은 호스트 주소로 찾아간다 —
# 2장 MLflow 서버의 S3_PUBLIC_ENDPOINT도 localhost가 아닌 서버 주소여야 한다 (미리 서명된 URL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowers-api
  namespace: mlops
spec:
  replicas: 2
  selector:
    matchLabels: {app: flowers-api}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # 새 파드가 준비되기 전에는 옛 파드를 내리지 않는다
      maxSurge: 1
  template:
    metadata:
      labels: {app: flowers-api}
    spec:
      containers:
        - name: api
          image: flowers-api:0.4.0
          imagePullPolicy: Never     # kind load로 노드에 넣은 이미지를 쓴다
          ports: [{containerPort: 8000}]
          env:
            - {name: MLFLOW_TRACKING_URI, value: "http://${HOST_IP}:5000"}
            - {name: MODEL_NAME, value: flowers-classifier}
            - {name: MODEL_VERSION, value: "9"}      # 별칭을 따라가지 않고 버전을 적는다
            - {name: TORCH_THREADS, value: "1"}
            - name: RELOAD_TOKEN
              valueFrom: {secretKeyRef: {name: flowers-api, key: reload-token}}
          resources:
            requests: {cpu: 500m, memory: 600Mi}     # HPA의 CPU 사용률은 이 요청량 대비
            limits: {memory: 1500Mi}
          lifecycle:
            preStop:                 # 종료 신호 전에 5초: 서비스 목록에서 빠지는 동안 들어온 요청까지 처리
              sleep: {seconds: 5}
          readinessProbe:            # 모델을 다 불러온 뒤에야 트래픽을 받는다
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flowers-api
  namespace: mlops
spec:
  type: NodePort
  selector: {app: flowers-api}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30080}
