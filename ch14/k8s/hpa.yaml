# CPU 사용률에 따라 파드 수를 2~4개로 (14-4). metrics-server가 있어야 한다
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowers-api
  namespace: mlops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: flowers-api}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
