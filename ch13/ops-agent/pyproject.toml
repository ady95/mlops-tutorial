[project]
name = "ch13-ops-agent"
version = "0.1.0"
description = "MLOps 따라하기 13장: 운영 보조 에이전트 (읽기 도구 + 승인 요청)"
requires-python = ">=3.12"
dependencies = [
    "openai==3.35.1",
    "mlflow-skinny==3.17.1",        # 실행 기록 조회와 에이전트 트레이스 (11장)
    "httpx==0.28.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
