  start: "2026-10-20T04:20:00Z"
  end: "2026-10-20T05:25:00Z"
  truth: >
    GPU 서버(llm) 전체가 꺼져 있었다 — 같은 서버의 dcgm·node-gpu·vllm도 모두 down. 모니터링 서버도 04:35에야 다시 켜져
    그 전 기록이 없다. GPU 서버는 05:05쯤 켜졌고, 게이트웨이는 vLLM이 준비되기 전에 뜨다 재시작을 반복해 05:15에 올라왔다.
    (05:20~05:23의 두 번째 중단은 재부팅을 흉내 낸 시험으로 vLLM·게이트웨이를 다시 띄운 것 — 처음 정답에 빠뜨렸고 에이전트가 찾았다)
  rubric:
    - 게이트웨이 하나가 아니라 GPU 서버 전체가 중단됐다고 판단한다 (같은 서버의 다른 대상 down을 근거로)
    - 04:35 이전 기록이 없다는 점(모니터링 서버 자체의 공백)을 알아챈다
    - 복구 순서(서버 → vLLM → 게이트웨이)나 게이트웨이 재시작 반복을 근거와 함께 설명한다
