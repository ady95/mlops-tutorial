data:                          # 학습 데이터 합성 (08-1)
  n_generate: 3000
  seed: 42
  concurrency: 16

# 베이스 모델 (08-2) — 리비전을 고정해야 같은 모델을 다시 받는다
model:
  name: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a

train:                         # LoRA 지도 미세조정 (08-3)
  run_name: ""                 # 비우면 r16-all-linear-none 처럼 설정에서 만든다
  data_dir: data/prepared      # 09-5 재학습은 data/prepared_v2
  quantization: none           # none = LoRA (bf16 베이스), 4bit = QLoRA
  target: all-linear           # all-linear | attention (q·k·v·o만)
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lr: 0.0002
  epochs: 2
  batch_size: 4
  grad_accum: 4                # 실효 배치 = 4 × 4 = 16
  max_length: 1024
  save_steps: 50
  save_total_limit: 3
  seed: 42

prepare:                       # 품질 검사와 분할 (08-1)
  seed: 42
  val_size: 200
  test_size: 300

evalset:                       # 평가 세트 합성 (09-2)
  seeds:
    evalset: 9                 # 개발용 평가 세트 — 약점 진단에 쓴다
    holdout: 99                # 보류 세트 — 재학습을 정한 뒤에 만들어 최종 판정에만 쓴다 (09-5)
  per_slice: 20                # 조각 6개 × 20 = 120건
  concurrency: 16

# LLM 배포 기준 (09-5) — 재학습 결과를 보기 전에 정했다
gate:
  # 형식이 깨진 출력은 한 건도 안 된다 (받는 쪽 시스템이 멈춘다)
  min_json_valid: 1.0
  min_all_fields: 0.80         # 보류 세트 다섯 필드 모두 정답
  # 어느 조각(주입·함정 등)도 이보다 낮으면 불가 — 평균이 약점을 가리지 않게
  min_slice_all_fields: 0.60
  min_summary_pass: 0.80       # 요약 심판(사실성·핵심 요청·한 문장) 모두 통과 비율
  # 8장 테스트 세트(학습 분포) — 원래 하던 일을 망가뜨리지 않았는지 (회귀)
  min_indist_all_fields: 0.97
  # 현재 champion보다 평가 세트 정답률이 이만큼 넘게 떨어지면 불가
  max_drop_vs_champion: 0.02

augment:                       # 학습 데이터 보강 (09-5)
  seed: 95
  per_kind: 150                # 형식이 틀린 주문번호 150 + 지시 주입 150
  concurrency: 16

monitor:                       # 운영 알림 기준 (11-4) — 평소 구간을 보고 정한다
  low_confidence: 0.9          # category 첫 토큰 확률이 이보다 낮으면 '확신 낮음'
  min_schema_valid: 0.99
  min_grounded: 0.95           # 주문번호·상품이 문의에 실제로 있는 비율
  max_low_confidence_rate: 0.10
  min_summary_pass: 0.80       # 표본 요약 심판 통과율
